<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勝利演出デモ（確認用）</title>

  <!-- 1. 紙吹雪ライブラリ (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <!-- 2. ポップアップ＆デモ画面のスタイル -->
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .demo-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      color: #facc15;
    }

    .section {
      background: #282828;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn {
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #facc15;
      color: #000;
      border-color: #facc15;
    }

    /* -----------------------------------
       モーダル＆ポップアップ用スタイル
    ----------------------------------- */
    .reward-modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9990;
    }

    .reward-modal-box {
      background: #1a1a1a;
      border: 2px solid #facc15;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      width: 80%;
      max-width: 320px;
      color: #fff;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
    }

    .reward-medal-container {
      margin: 15px 0;
      position: relative;
      display: inline-block;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* キラキラ星の演出 */
    .sparkle-crown {
      position: relative;
      display: inline-block;
    }

    .sparkle-star {
      position: absolute;
      color: #fff176;
      font-style: normal;
      animation: sparkleAnim 1.5s infinite ease-in-out alternate;
      pointer-events: none;
    }
    .star-1 { top: -10px; left: -10px; font-size: 14px; animation-delay: 0s; }
    .star-2 { top: -10px; right: -10px; font-size: 18px; animation-delay: 0.3s; }
    .star-3 { bottom: -5px; left: -5px; font-size: 16px; animation-delay: 0.6s; }
    .star-4 { bottom: -5px; right: -5px; font-size: 12px; animation-delay: 0.9s; }

    @keyframes sparkleAnim {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .reward-close-btn {
      margin-top: 15px;
      background: #facc15;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="demo-card">
    <h1>🏆 勝利演出 テストデモ</h1>

    <!-- 🟢 よわい -->
    <div class="section">
      <div class="section-title" style="color: #4ade80;">🟢 よわい (easy)</div>
      <div class="btn-group">
        <button class="btn" onclick="checkAndShowReward(5, 'easy')">5連勝</button>
        <button class="btn" onclick="checkAndShowReward(10, 'easy')">10連勝</button>
        <button class="btn" onclick="checkAndShowReward(20, 'easy')">20連勝</button>
      </div>
    </div>

    <!-- 🟡 ふつう -->
    <div class="section">
      <div class="section-title" style="color: #facc15;">🟡 ふつう (medium)</div>
      <div class="btn-group">
        <button class="btn" onclick="checkAndShowReward(5, 'medium')">5連勝</button>
        <button class="btn" onclick="checkAndShowReward(10, 'medium')">10連勝</button>
        <button class="btn" onclick="checkAndShowReward(20, 'medium')">20連勝</button>
      </div>
    </div>

    <!-- 🔴 つよい -->
    <div class="section">
      <div class="section-title" style="color: #f87171;">🔴 つよい (hard)</div>
      <div class="btn-group">
        <button class="btn" onclick="checkAndShowReward(5, 'hard')">5連勝</button>
        <button class="btn" onclick="checkAndShowReward(10, 'hard')">10連勝</button>
        <button class="btn" onclick="checkAndShowReward(20, 'hard')">20連勝</button>
      </div>
    </div>
  </div>

  <!-- 3. 作成済みのイベント処理JSを読み込み -->
  <script src="achievement.js"></script>
</body>
</html>
